<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزانيتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ec;--card:#fff;--ink:#1c2a33;--mut:#68757e;--line:#e2e0d6;--in:#0f766e;--out:#b4442e;--debt:#9a6a07;--btn:#1c2a33;--btnfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--card:#1b262d;--ink:#e8ece9;--mut:#93a0a8;--line:#2b3942;--in:#34c3b3;--out:#f08a72;--debt:#e3b341;--btn:#e8ece9;--btnfg:#121a1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1f;--card:#1b262d;--ink:#e8ece9;--mut:#93a0a8;--line:#2b3942;--in:#34c3b3;--out:#f08a72;--debt:#e3b341;--btn:#e8ece9;--btnfg:#121a1f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.5;max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month{display:flex;align-items:center;gap:6px}
.month b{min-width:110px;text-align:center}
button{font-family:inherit;font-size:15px;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.primary{background:var(--btn);color:var(--btnfg);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.sub{color:var(--mut);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}.debt{color:var(--debt)}
.big{font-size:28px;font-weight:800}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px;gap:4px}
nav button{flex:1;background:none;padding:8px 2px;color:var(--mut);font-size:14px}
nav button.on{color:var(--ink);font-weight:800;background:var(--line)}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.25)}
dialog{border:0;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font-family:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;color:var(--ink)}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:9px;border-radius:10px;background:var(--line)}
.seg input:checked+span{background:var(--btn);color:var(--btnfg);font-weight:700}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1;padding:12px}
.x{background:none;color:var(--mut);padding:4px 8px}
.tag{font-size:12px;padding:1px 8px;border-radius:8px;background:var(--line)}
.late{color:var(--out);font-weight:700}
</style>
</head>
<body>
<div class="top"><h1>ميزانيتي</h1><div class="month"><button id="nx" aria-label="الشهر التالي">›</button><b id="ml"></b><button id="pv" aria-label="الشهر السابق">‹</button></div></div>
<main id="v"></main>
<button class="fab primary" id="fab" aria-label="إضافة">+</button>
<nav><div id="nav"></div></nav>
<dialog id="dlg"><form id="fm" method="dialog"></form></dialog>
<script>
var CUR={YER:"ر.ي",SAR:"ر.س"},CATS=["طعام","مواصلات","فواتير","سكن","صحة","تعليم","ملابس","ترفيه","أخرى"],INC=["راتب","عمل حر","هدية","أخرى"];
var S={tx:[],debts:[],obl:[]},tab="sum",ym=new Date().toISOString().slice(0,7),armed=null;
try{var r=localStorage.getItem("budget");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("budget",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(v){return Number(v).toLocaleString("en-US",{maximumFractionDigits:2})}
function m(v,c){return '<span class="num">'+n(v)+" "+CUR[c]+"</span>"}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mname(){var p=ym.split("-");return new Date(p[0],p[1]-1,1).toLocaleDateString("ar",{month:"long",year:"numeric"})}
function shift(d){var p=ym.split("-"),x=new Date(p[0],p[1]-1+d,1);ym=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");render()}
function sum(a,f){return a.reduce(function(t,x){return t+f(x)},0)}
function days(d){return Math.round((new Date(d)-new Date(today()))/864e5)}
function inM(x){return x.date.slice(0,7)===ym}

function summary(){
 var h="";
 Object.keys(CUR).forEach(function(c){
  var t=S.tx.filter(function(x){return inM(x)&&x.cur===c});
  var inc=sum(t.filter(function(x){return x.type==="in"}),function(x){return +x.amt});
  var exp=sum(t.filter(function(x){return x.type==="out"}),function(x){return +x.amt});
  var ob=S.obl.filter(function(o){return o.cur===c&&!o.done&&o.due.slice(0,7)===ym});
  var obT=sum(ob,function(o){return +o.amt});
  var owe=sum(S.debts.filter(function(d){return d.cur===c&&d.dir==="owe"}),function(d){return d.amt-d.paid});
  var owed=sum(S.debts.filter(function(d){return d.cur===c&&d.dir==="owed"}),function(d){return d.amt-d.paid});
  if(!t.length&&!obT&&!owe&&!owed)return;
  var bal=inc-exp,cats={};
  t.filter(function(x){return x.type==="out"}).forEach(function(x){cats[x.cat]=(cats[x.cat]||0)+ +x.amt});
  var cl=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).map(function(k){return '<div style="margin-top:8px"><div class="row" style="border:0;padding:0"><span>'+esc(k)+'</span>'+m(cats[k],c)+'</div><div class="bar"><i style="width:'+Math.round(cats[k]/exp*100)+'%"></i></div></div>'}).join("");
  h+='<div class="card"><h2>الملخص بـ'+(c==="YER"?"الريال اليمني":"الريال السعودي")+'</h2>'+
  '<div class="sub">الرصيد هذا الشهر</div><div class="big '+(bal<0?"out":"in")+'">'+m(bal,c)+'</div>'+
  '<div class="grid" style="margin-top:12px"><div><div class="sub">الدخل</div><span class="in">'+m(inc,c)+'</span></div><div><div class="sub">المصروف</div><span class="out">'+m(exp,c)+'</span></div></div>'+
  '<div class="row" style="margin-top:8px"><span>التزامات قادمة هذا الشهر</span>'+m(obT,c)+'</div>'+
  '<div class="row"><span><b>المتبقي بعد الالتزامات</b></span><span class="'+(bal-obT<0?"out":"in")+'">'+m(bal-obT,c)+'</span></div>'+
  '<div class="row"><span>ديون علي</span><span class="debt">'+m(owe,c)+'</span></div>'+
  '<div class="row"><span>ديون لي</span><span class="debt">'+m(owed,c)+'</span></div>'+
  (cl?'<h2 style="margin-top:14px">المصروف حسب الفئة</h2>'+cl:"")+'</div>';
 });
 return h||'<div class="empty">لا توجد بيانات لهذا الشهر.<br>اضغط + لإضافة أول حركة.</div>';
}
function delBtn(k,id){return '<button class="x" data-del="'+k+':'+id+'">'+(armed===k+":"+id?'<span class="out">تأكيد الحذف</span>':"✕")+'</button>'}
function txList(){
 var t=S.tx.filter(inM).sort(function(a,b){return b.date.localeCompare(a.date)});
 if(!t.length)return '<div class="empty">لا توجد حركات في هذا الشهر.</div>';
 return '<div class="card">'+t.map(function(x){return '<div class="row"><div><div>'+esc(x.cat)+(x.note?' <span class="sub">— '+esc(x.note)+'</span>':"")+'</div><div class="sub">'+x.date+'</div></div><div style="display:flex;align-items:center"><span class="'+(x.type==="in"?"in":"out")+'">'+(x.type==="in"?"+":"−")+m(x.amt,x.cur)+'</span>'+delBtn("tx",x.id)+'</div></div>'}).join("")+'</div>';
}
function debtList(){
 if(!S.debts.length)return '<div class="empty">لا توجد ديون مسجلة.</div>';
 return S.debts.map(function(d){var left=d.amt-d.paid;return '<div class="card"><div class="row" style="border:0;padding:0"><b>'+esc(d.who)+' <span class="tag">'+(d.dir==="owe"?"علي":"لي")+'</span></b>'+delBtn("debt",d.id)+'</div>'+
 '<div class="row"><span class="sub">المبلغ الكلي</span>'+m(d.amt,d.cur)+'</div><div class="row"><span class="sub">المسدد</span>'+m(d.paid,d.cur)+'</div><div class="row"><span>المتبقي</span><span class="debt">'+m(left,d.cur)+'</span></div>'+
 (d.due?'<div class="sub">موعد السداد: '+d.due+'</div>':"")+
 (left>0?'<div class="acts"><button data-pay="'+d.id+'">تسجيل دفعة</button></div>':'<div class="sub in">تم السداد بالكامل</div>')+'</div>'}).join("");
}
function oblList(){
 if(!S.obl.length)return '<div class="empty">لا توجد التزامات قادمة.</div>';
 var l=S.obl.slice().sort(function(a,b){return a.done-b.done||a.due.localeCompare(b.due)});
 return '<div class="card">'+l.map(function(o){var d=days(o.due),st=o.done?'<span class="in">مدفوع</span>':d<0?'<span class="late">متأخر '+(-d)+' يوم</span>':d===0?'<span class="late">اليوم</span>':'بعد '+d+' يوم';
 return '<div class="row"><div><div'+(o.done?' style="text-decoration:line-through;color:var(--mut)"':"")+'>'+esc(o.title)+'</div><div class="sub">'+o.due+' · '+st+'</div></div><div style="display:flex;align-items:center;gap:4px">'+m(o.amt,o.cur)+(o.done?"":'<button data-ok="'+o.id+'">دفع</button>')+delBtn("obl",o.id)+'</div></div>'}).join("")+'</div>';
}
var TABS=[["sum","الملخص"],["tx","الحركة"],["debt","الديون"],["obl","الالتزامات"]];
function render(){
 $("ml").textContent=mname();
 $("nav").innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
 $("v").innerHTML=tab==="sum"?summary():tab==="tx"?txList():tab==="debt"?debtList():oblList();
 $("fab").style.display=tab==="sum"?"none":"block";
 document.querySelector(".month").style.visibility=(tab==="debt")?"hidden":"visible";
}
function curSel(){return '<select name="cur"><option value="YER">ر.ي</option><option value="SAR">ر.س</option></select>'}
function opts(a){return a.map(function(x){return '<option>'+x+'</option>'}).join("")}
function foot(){return '<div class="acts"><button type="button" id="cn">إلغاء</button><button class="primary" id="sv" type="submit" value="ok">حفظ</button></div>'}
var kind="",pid="";
function openSheet(k,id){
 kind=k;pid=id||"";var h="";
 if(k==="tx")h='<div class="seg"><label><input type="radio" name="type" value="out" checked><span>مصروف</span></label><label><input type="radio" name="type" value="in"><span>دخل</span></label></div><div class="two"><div><label>المبلغ</label><input name="amt" type="number" inputmode="decimal" step="any" min="0" required></div><div><label>العملة</label>'+curSel()+'</div></div><label>الفئة</label><select name="cat" id="cat">'+opts(CATS)+'</select><label>ملاحظة</label><input name="note"><label>التاريخ</label><input name="date" type="date" value="'+today()+'" required>'+foot();
 if(k==="debt")h='<div class="seg"><label><input type="radio" name="dir" value="owe" checked><span>علي</span></label><label><input type="radio" name="dir" value="owed"><span>لي</span></label></div><label>الاسم</label><input name="who" required><div class="two"><div><label>المبلغ</label><input name="amt" type="number" inputmode="decimal" step="any" min="0" required></div><div><label>العملة</label>'+curSel()+'</div></div><label>موعد السداد (اختياري)</label><input name="due" type="date">'+foot();
 if(k==="obl")h='<label>الالتزام</label><input name="title" required placeholder="إيجار، قسط، فاتورة…"><div class="two"><div><label>المبلغ</label><input name="amt" type="number" inputmode="decimal" step="any" min="0" required></div><div><label>العملة</label>'+curSel()+'</div></div><label>تاريخ الاستحقاق</label><input name="due" type="date" value="'+today()+'" required>'+foot();
 if(k==="pay")h='<label>مبلغ الدفعة</label><input name="amt" type="number" inputmode="decimal" step="any" min="0" required>'+foot();
 $("fm").innerHTML=h;
 if(k==="tx")$("fm").querySelectorAll("[name=type]").forEach(function(r){r.onchange=function(){$("cat").innerHTML=opts(r.value==="in"?INC:CATS)}});
 $("cn").onclick=function(){$("dlg").close()};
 $("dlg").showModal();
}
$("fm").onsubmit=function(e){
 e.preventDefault();var f=Object.fromEntries(new FormData($("fm")).entries());
 if(kind==="tx"){f.id=uid();S.tx.push(f);ym=f.date.slice(0,7)}
 if(kind==="debt"){f.id=uid();f.paid=0;S.debts.push(f)}
 if(kind==="obl"){f.id=uid();f.done=false;S.obl.push(f)}
 if(kind==="pay"){var d=S.debts.find(function(x){return x.id===pid});d.paid=Math.min(+d.amt,+d.paid+ +f.amt)}
 save();$("dlg").close();render();
};
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;var d=t.dataset;
 if(d.tab){tab=d.tab;armed=null;render()}
 else if(d.pay)openSheet("pay",d.pay);
 else if(d.ok){var o=S.obl.find(function(x){return x.id===d.ok});o.done=true;S.tx.push({id:uid(),type:"out",amt:o.amt,cur:o.cur,cat:"التزامات",note:o.title,date:today()});save();render()}
 else if(d.del){if(armed===d.del){var p=d.del.split(":"),k={tx:"tx",debt:"debts",obl:"obl"}[p[0]];S[k]=S[k].filter(function(x){return x.id!==p[1]});armed=null;save()}else{armed=d.del;setTimeout(function(){if(armed===d.del){armed=null;render()}},3000)}render()}
});
$("fab").onclick=function(){openSheet({tx:"tx",debt:"debt",obl:"obl"}[tab])};
$("pv").onclick=function(){shift(-1)};$("nx").onclick=function(){shift(1)};
render();
</script>
</body>
</html>
